name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

# The live suites target current HAXcms `main`, NOT the npm-published release: the MCP uses the
# files.json datastore / file operations and the page-break rejection, which the published
# @haxtheweb/haxcms-nodejs@26.8.1 does not have. Bump HAXCMS_NODEJS_REF to a tag or SHA to pin.
env:
  HAXCMS_NODEJS_REPO: haxtheweb/haxcms-nodejs
  HAXCMS_NODEJS_REF: main
  HAXCMS_PHP_REPO: haxtheweb/haxcms-php
  HAXCMS_PHP_REF: master  # haxcms-php's default branch is master, not main

# least privilege: every job only reads the repository (security audit)
permissions:
  contents: read

jobs:
  lint-unit:
    name: Lint + typecheck + unit (Python ${{ matrix.python-version }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.12", "3.13"]
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@d4b2f3b6ecc6e67c4457f6d3e41ec42d3d0fcb86 # v5
        with:
          enable-cache: true
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install dependencies
        run: uv sync
      - name: Ruff check
        run: uv run ruff check .
      - name: Ruff format check
        run: uv run ruff format --check .
      - name: Mypy (strict)
        run: uv run mypy src
      - name: Generated converters drift check
        run: uv run python scripts/gen_tools.py --check
      - name: Generated routes drift check
        run: uv run python scripts/gen_routes.py --check
      - name: Tool docs drift check
        run: uv run python scripts/gen_tool_docs.py --check
      - name: Unit tests
        run: uv run pytest -m unit --cov --cov-report=xml:coverage-unit-${{ matrix.python-version }}.xml --cov-fail-under=80
      - name: Upload coverage
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: coverage-unit-${{ matrix.python-version }}
          path: coverage-unit-${{ matrix.python-version }}.xml
          if-no-files-found: ignore

  integration:
    name: Integration + functional + regression (spawns HAXcms)
    runs-on: ubuntu-latest
    needs: lint-unit
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@d4b2f3b6ecc6e67c4457f6d3e41ec42d3d0fcb86 # v5
        with:
          enable-cache: true
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.12"
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: "22"
      - name: Check out HAXcms (${{ env.HAXCMS_NODEJS_REF }})
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
          repository: ${{ env.HAXCMS_NODEJS_REPO }}
          ref: ${{ env.HAXCMS_NODEJS_REF }}
          path: .haxcms-nodejs
      - name: Install dependencies
        run: uv sync
      - name: Run non-unit, non-e2e suites against a live HAXcms
        run: uv run pytest -m "not e2e and not unit" --cov --cov-report=xml:coverage-integration.xml
        env:
          HAXCMS_MCP_TEST_HAXCMS_DIR: ${{ github.workspace }}/.haxcms-nodejs
      - name: Upload coverage
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: coverage-integration
          path: coverage-integration.xml
          if-no-files-found: ignore

  integration-php:
    name: Integration + functional against HAXcms PHP
    runs-on: ubuntu-latest
    needs: lint-unit
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@d4b2f3b6ecc6e67c4457f6d3e41ec42d3d0fcb86 # v5
        with:
          enable-cache: true
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.12"
      - uses: shivammathur/setup-php@eb7c497e18156a6bbabfef1d3a82760b9eda3962 # v2
        with:
          php-version: "8.3"
          extensions: gd, curl, mbstring, dom, zip
          tools: none
      # A plain shallow clone instead of actions/checkout: the repo is large (46k files), and
      # every outcome below is also written to the job summary so it can be read via the API.
      - name: Check out HAXcms PHP (${{ env.HAXCMS_PHP_REF }})
        run: |
          if ! git clone --depth 1 --branch "$HAXCMS_PHP_REF" \
              "https://github.com/$HAXCMS_PHP_REPO" .haxcms-php > clone.log 2>&1; then
            { echo '### HAXcms PHP checkout failed'; echo '```'; tail -40 clone.log; echo '```'; } >> "$GITHUB_STEP_SUMMARY"
            cat clone.log
            # annotations are readable through the checks API (job logs need blob storage)
            tail -5 clone.log | tr -d '\r' | while IFS= read -r line; do echo "::error title=clone::$line"; done
            df -h . | tail -1 | sed 's/^/::error title=disk::/'
            exit 1
          fi
          git -C .haxcms-php log --oneline -1
      - name: Install dependencies
        run: uv sync
      - name: Run integration + functional suites against a live HAXcms PHP
        run: |
          set +e
          uv run pytest -m "integration or functional" -rfE 2>&1 | tee pytest.log
          status=${PIPESTATUS[0]}
          grep -E '^(FAILED|ERROR) |[0-9]+ (passed|failed)' pytest.log | tail -40 | while IFS= read -r line; do echo "::notice title=pytest::$line"; done
          { echo '### HAXcms PHP live suites'; echo '```'; grep -E '^(FAILED|ERROR) |passed|failed' pytest.log | tail -60; echo '```'; } >> "$GITHUB_STEP_SUMMARY"
          exit "$status"
        env:
          HAXCMS_MCP_TEST_BACKEND: php
          HAXCMS_MCP_TEST_HAXCMS_PHP_DIR: ${{ github.workspace }}/.haxcms-php

  e2e:
    name: End-to-end over stdio (PRs only)
    runs-on: ubuntu-latest
    if: github.event_name == 'pull_request' && github.base_ref == 'main'
    needs: lint-unit
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@d4b2f3b6ecc6e67c4457f6d3e41ec42d3d0fcb86 # v5
        with:
          enable-cache: true
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.12"
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: "22"
      - name: Check out HAXcms (${{ env.HAXCMS_NODEJS_REF }})
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
          repository: ${{ env.HAXCMS_NODEJS_REPO }}
          ref: ${{ env.HAXCMS_NODEJS_REF }}
          path: .haxcms-nodejs
      - name: Install dependencies
        run: uv sync
      - name: Run e2e suite
        run: uv run pytest -m e2e --cov --cov-report=xml:coverage-e2e.xml
        env:
          HAXCMS_MCP_TEST_HAXCMS_DIR: ${{ github.workspace }}/.haxcms-nodejs
      - name: Upload coverage
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: coverage-e2e
          path: coverage-e2e.xml
          if-no-files-found: ignore
