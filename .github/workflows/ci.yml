name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  lint-unit:
    name: Lint + typecheck + unit (Python ${{ matrix.python-version }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.12", "3.13"]
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install dependencies
        run: uv sync
      - name: Ruff check
        run: uv run ruff check .
      - name: Ruff format check
        run: uv run ruff format --check .
      - name: Mypy (strict)
        run: uv run mypy src
      - name: Generated converters drift check
        run: uv run python scripts/gen_tools.py --check
      - name: Tool docs drift check
        run: uv run python scripts/gen_tool_docs.py --check
      - name: Unit tests
        run: uv run pytest -m unit --cov --cov-report=xml:coverage-unit-${{ matrix.python-version }}.xml --cov-fail-under=80
      - name: Upload coverage
        uses: actions/upload-artifact@v4
        with:
          name: coverage-unit-${{ matrix.python-version }}
          path: coverage-unit-${{ matrix.python-version }}.xml
          if-no-files-found: ignore

  integration:
    name: Integration + functional + regression (spawns HAXcms)
    runs-on: ubuntu-latest
    needs: lint-unit
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Cache HAXcms runtime
        uses: actions/cache@v4
        with:
          path: .haxcms-runtime
          key: haxcms-runtime-${{ hashFiles('specs/VERSION') }}-${{ hashFiles('pyproject.toml') }}
      - name: Install dependencies
        run: uv sync
      - name: Run non-unit, non-e2e suites against a live HAXcms
        run: uv run pytest -m "not e2e and not unit" --cov --cov-report=xml:coverage-integration.xml
        env:
          HAXCMS_MCP_TEST_HAXCMS_VERSION: "26.8.1"
      - name: Upload coverage
        uses: actions/upload-artifact@v4
        with:
          name: coverage-integration
          path: coverage-integration.xml
          if-no-files-found: ignore

  e2e:
    name: End-to-end over stdio (PRs only)
    runs-on: ubuntu-latest
    if: github.event_name == 'pull_request' && github.base_ref == 'main'
    needs: lint-unit
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Cache HAXcms runtime
        uses: actions/cache@v4
        with:
          path: .haxcms-runtime
          key: haxcms-runtime-${{ hashFiles('specs/VERSION') }}-${{ hashFiles('pyproject.toml') }}
      - name: Install dependencies
        run: uv sync
      - name: Run e2e suite
        run: uv run pytest -m e2e --cov --cov-report=xml:coverage-e2e.xml
      - name: Upload coverage
        uses: actions/upload-artifact@v4
        with:
          name: coverage-e2e
          path: coverage-e2e.xml
          if-no-files-found: ignore
