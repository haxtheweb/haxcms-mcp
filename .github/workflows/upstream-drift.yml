name: Upstream drift

# haxcms-mcp is a typed client of the HAXcms HTTP API, so it breaks when that API changes.
# This workflow makes drift a red run within a day instead of a user bug report:
#   1. the vendored OpenAPI specs in specs/ must equal haxcms-nodejs main's src/openapi/
#   2. the live suites must pass against a fresh haxcms-nodejs main checkout
#   3. the live suites must pass against a fresh haxcms-php master checkout
# Each check is its own job, so one backend failing never hides the other.
# Fix drift with: uv run python scripts/sync_specs.py --from <haxcms-nodejs checkout>, then
# scripts/gen_routes.py, scripts/gen_tools.py and scripts/gen_tool_docs.py (see README
# "Keeping up with HAXcms").

on:
  schedule:
    - cron: "17 5 * * *" # nightly, 05:17 UTC
  workflow_dispatch:
    inputs:
      haxcms_ref:
        description: haxtheweb/haxcms-nodejs ref to compare against
        default: main
        required: false
      haxcms_php_ref:
        description: haxtheweb/haxcms-php ref to run the live suites against
        default: master
        required: false

env:
  HAXCMS_NODEJS_REF: ${{ inputs.haxcms_ref || 'main' }}
  HAXCMS_PHP_REPO: haxtheweb/haxcms-php
  HAXCMS_PHP_REF: ${{ inputs.haxcms_php_ref || 'master' }} # haxcms-php's default branch is master

# least privilege: every job only reads the repository (security audit)
permissions:
  contents: read

jobs:
  spec-drift:
    name: Vendored specs vs haxcms-nodejs
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
        with:
          enable-cache: true
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.12"
      - name: Check out HAXcms (${{ env.HAXCMS_NODEJS_REF }})
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          repository: haxtheweb/haxcms-nodejs
          ref: ${{ env.HAXCMS_NODEJS_REF }}
          path: .haxcms-nodejs
      - name: Install dependencies
        run: uv sync
      - name: Diff specs/ against src/openapi/
        run: uv run python scripts/sync_specs.py --check --from .haxcms-nodejs
      # Even when the specs differ: would the hand-written client still fit the upstream
      # routes after a plain regenerate? A removed or renamed operation fails mypy here
      # (ADR-0005), which says whether the fix is "regenerate" or "edit the client".
      - name: Regenerate routes from upstream and type-check the client
        if: always()
        run: |
          uv run python scripts/sync_specs.py --from .haxcms-nodejs
          uv run python scripts/gen_routes.py
          git --no-pager diff --stat -- src/haxcms_mcp/generated
          uv run mypy src
          uv run pytest -m unit -q

  live-suite:
    name: Live suites against haxcms-nodejs
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
        with:
          enable-cache: true
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.12"
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "22"
      - name: Check out HAXcms (${{ env.HAXCMS_NODEJS_REF }})
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          repository: haxtheweb/haxcms-nodejs
          ref: ${{ env.HAXCMS_NODEJS_REF }}
          path: .haxcms-nodejs
      - name: Install dependencies
        run: uv sync
      - name: Run non-unit, non-e2e suites
        run: uv run pytest -m "not unit and not e2e"
        env:
          HAXCMS_MCP_TEST_HAXCMS_DIR: ${{ github.workspace }}/.haxcms-nodejs

  # Same setup as ci.yml's integration-php job: plain PHP 8.3 built-in server, no Apache/Docker.
  live-suite-php:
    name: Live suites against haxcms-php
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
        with:
          enable-cache: true
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.12"
      - uses: shivammathur/setup-php@eb7c497e18156a6bbabfef1d3a82760b9eda3962 # v2
        with:
          php-version: "8.3"
          extensions: gd, curl, mbstring, dom, zip
          tools: none
      # A plain shallow clone instead of actions/checkout: the repo is large (46k files), and
      # every outcome below is also written to the job summary so it can be read via the API.
      - name: Check out HAXcms PHP (${{ env.HAXCMS_PHP_REF }})
        run: |
          if ! git clone --depth 1 --branch "$HAXCMS_PHP_REF" \
              "https://github.com/$HAXCMS_PHP_REPO" .haxcms-php > clone.log 2>&1; then
            { echo '### HAXcms PHP checkout failed'; echo '```'; tail -40 clone.log; echo '```'; } >> "$GITHUB_STEP_SUMMARY"
            cat clone.log
            tail -5 clone.log | tr -d '\r' | while IFS= read -r line; do echo "::error title=clone::$line"; done
            exit 1
          fi
          git -C .haxcms-php log --oneline -1
      - name: Install dependencies
        run: uv sync
      - name: Run integration + functional suites against a live HAXcms PHP
        run: |
          set +e
          uv run pytest -m "integration or functional" -rfE 2>&1 | tee pytest.log
          status=${PIPESTATUS[0]}
          grep -E '^(FAILED|ERROR) |[0-9]+ (passed|failed)' pytest.log | tail -40 | while IFS= read -r line; do echo "::notice title=pytest::$line"; done
          { echo '### HAXcms PHP live suites'; echo '```'; grep -E '^(FAILED|ERROR) |passed|failed' pytest.log | tail -60; echo '```'; } >> "$GITHUB_STEP_SUMMARY"
          exit "$status"
        env:
          HAXCMS_MCP_TEST_BACKEND: php
          HAXCMS_MCP_TEST_HAXCMS_PHP_DIR: ${{ github.workspace }}/.haxcms-php
