[project]
name = "haxcms-mcp"
version = "0.1.0"
description = "MCP server that lets an AI agent operate a self-hosted HAXcms NodeJS instance like a human author."
readme = "README.md"
authors = [
    { name = "Trivi Sunil", email = "120649138+Cloudhoppr@users.noreply.github.com" }
]
requires-python = ">=3.12"
dependencies = [
    "fastmcp==4.0.10",
    "httpx>=0.27",
    "pydantic>=2",
    "pydantic-settings>=2",
    "lxml>=5",
    "pyyaml>=6",
    "anyio>=4",
]

[project.scripts]
haxcms-mcp = "haxcms_mcp.__main__:main"

[build-system]
requires = ["uv_build>=0.8.4,<0.9.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "pytest>=8",
    "pytest-asyncio>=0.24",
    "pytest-cov>=5",
    "respx>=0.21",
    "syrupy>=4",
    "ruff>=0.6",
    "mypy>=1.11",
    "types-PyYAML>=6",
    "lxml-stubs>=0.5",
    "python-docx>=1.2.0",
    "python-pptx>=1.0.2",
    "openpyxl>=3.1.5",
    "fpdf2>=2.8.9",
]

[tool.ruff]
line-length = 100
target-version = "py312"
src = ["src", "tests", "scripts"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "B", "SIM"]

[tool.mypy]
strict = true
files = ["src"]
mypy_path = "src"
plugins = ["pydantic.mypy"]

[[tool.mypy.overrides]]
module = ["lxml.*"]
ignore_missing_imports = true

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "session"
# tests must share the session loop too: a function-loop test awaiting a session-loop
# fixture (fastmcp in-memory Client task group) deadlocks silently on Windows.
asyncio_default_test_loop_scope = "session"
markers = [
    "unit: fast tests, no HAXcms instance, HTTP mocked",
    "integration: tool/service/client against a real spawned HAXcms",
    "functional: user-story journeys through the tool interface",
    "regression: snapshot and golden-output tests",
    "e2e: full tutorial journey over the real stdio transport",
    "needs_chrome: requires Chrome/Chromium for PDF rendering",
    "slow: long-running test",
    "network: fetches from the public internet (skipped in CI unless HAXCMS_MCP_TEST_NETWORK=1)",
]
filterwarnings = ["error::DeprecationWarning:haxcms_mcp.*"]

[tool.coverage.run]
source = ["src/haxcms_mcp"]

[tool.coverage.report]
precision = 1
